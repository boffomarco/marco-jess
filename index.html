<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save the Date — Marco &amp; Jess | September 4, 2027</title>
    <meta name="description"
        content="Save the Date: Join Marco Boffo and Jess Kelly as they celebrate their wedding on Saturday, September 4, 2027 in San Zenone degli Ezzelini &amp; Bassano del Grappa, Italy.">
    <meta name="theme-color" content="#4a1215">

    <!-- Open Graph Metadata -->
    <meta property="og:title" content="Save the Date — Marco &amp; Jess">
    <meta property="og:description"
        content="September 4, 2027 • San Zenone degli Ezzelini &amp; Bassano del Grappa, Italy.">
    <meta property="og:image" content="assets/logo.png">
    <meta property="og:type" content="website">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/logo.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@300;400;500;600&family=Prata&display=swap"
        rel="stylesheet">

    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Accessible Skip to Content -->
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <!-- Top Navigation -->
    <header class="header">
        <nav class="navbar" aria-label="Main Navigation">
            <div class="nav-container">
                <a href="#home" class="nav-brand" aria-label="Marco and Jess Wedding Home">
                    <img src="assets/logo.png" alt="" class="nav-logo" width="44" height="34">
                    <img src="assets/images/names.png" alt="Marco and Jess" class="nav-names-img" width="4844" height="872">
                </a>

                <button class="nav-toggle" aria-label="Toggle navigation menu" aria-expanded="false"
                    aria-controls="primary-nav-links">
                    <span class="hamburger-bar"></span>
                    <span class="hamburger-bar"></span>
                    <span class="hamburger-bar"></span>
                </button>

                <ul class="nav-links" id="primary-nav-links">
                    <li><a href="#home">Home</a></li>
                    <li><a href="#schedule">The Plan</a></li>
                    <li><a href="#getting-around">Getting Around</a></li>
                    <li><a href="#planning-trip">Planning Your Trip</a></li>
                    <li><a href="#countdown">Countdown</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main id="main-content">

        <!-- 1. Hero Section -->
        <section id="home" class="hero" aria-label="Save the Date Announcement">
            <div class="hero-content">
                <div class="hero-stamp-wrapper">
                    <img src="assets/logo.png" alt="Marco and Jess stamp" class="hero-stamp" width="96" height="75">
                </div>
                <div class="hero-title-wrapper">
                    <img src="assets/images/title_first.png" alt="We Are Getting Married! Marco + Jess"
                        class="hero-title-img" width="1406" height="478">
                </div>
                <div class="hero-envelope-wrapper">
                    <img src="assets/images/envelope_more.png" alt="Save the Date — September 4, 2027"
                        class="hero-envelope-img" width="715" height="779">
                </div>
                <div class="hero-info-wrapper">
                    <img src="assets/images/info_text.png"
                        alt="We would love to see you in Italy next year! We know some of you will be travelling from far, so we've included some more details to help you plan your trips"
                        class="hero-info-img" width="5156" height="2828">
                </div>
                <div class="hero-video-wrapper">
                    <img src="assets/images/video.gif?v=3" alt="Marco and Jess photo booth strip" class="hero-video"
                        width="600" height="945">
                </div>
            </div>
        </section>

        <!-- 2. Event Schedule Section ("The Plan" PDF) -->
        <section id="schedule" class="schedule-section" aria-label="The Plan">
            <div class="container container-wide">
                <div class="itinerary-frame">
                    <div class="pdf-page-wrapper itinerary-pdf-wrapper">
                        <img src="assets/images/itinerary_from_pdf.png?v=3"
                            alt="The Plan — wedding itinerary for September 3 and 4, 2027, including the welcome aperitivo, ceremony at Chiesetta Madonna Della Salute, and reception at Villa Ca Rezzonico"
                            width="1706" height="1706" loading="lazy">
                        <a href="https://share.google/jmTms8t6WzTQvUrC8" target="_blank" rel="noopener noreferrer"
                            class="pdf-hotspot" style="left: 45.8%; top: 60.2%; width: 11.4%; height: 3.1%;"
                            aria-label="Open Chiesetta Madonna Della Salute in Google Maps"></a>
                        <a href="https://share.google/GbdUP79mKjqyH3wOm" target="_blank" rel="noopener noreferrer"
                            class="pdf-hotspot" style="left: 40.2%; top: 75.8%; width: 11.4%; height: 3.1%;"
                            aria-label="Open Villa Ca Rezzonico in Google Maps"></a>
                    </div>
                </div>
            </div>
        </section>

        <!-- 3. Getting Around Section -->
        <section id="getting-around" class="getting-around-section" aria-label="Getting Around">
            <div class="container container-wide">
                <div class="getting-around-frame">
                    <img src="assets/images/getting_around.png"
                        alt="Getting Around — travel tips by car, train, and wedding day shuttle"
                        width="5722" height="4350" loading="lazy">
                </div>
            </div>
        </section>

        <!-- 4. Planning Your Trip Section (PDF) -->
        <section id="planning-trip" class="planning-trip-section" aria-label="Planning Your Trip">
            <div class="container container-wide">
                <div class="planning-trip-frame">
                    <div class="pdf-page-wrapper planning-pdf-wrapper">
                        <img src="assets/images/planning_trip.png?v=5"
                            alt="Planning Your Trip — accommodation recommendations in Bassano del Grappa, Hotel Glamour discount code CAREZ25, and flying into Venice or Treviso"
                            width="899" height="1239" loading="lazy">
                        <a href="https://hotelglamour.it/en/" target="_blank" rel="noopener noreferrer"
                            class="pdf-hotspot" style="left: 23.6%; top: 52.2%; width: 7.8%; height: 3.7%;"
                            aria-label="Visit Hotel Glamour website"></a>
                    </div>
                </div>
            </div>
        </section>

        <!-- 4. Countdown Section -->
        <section id="countdown" class="countdown-section" aria-label="Wedding Countdown">
            <div class="container">
                <div class="countdown-heading-wrapper">
                    <img src="assets/images/countdown.png" alt="The countdown is on!" class="countdown-heading-img"
                        width="6769" height="875" loading="lazy">
                </div>
                <div class="timer" id="timer" role="timer" aria-live="polite">
                    <div class="time-block">
                        <span id="days" class="time-number">--</span>
                        <p class="time-label">Days</p>
                    </div>
                    <div class="time-separator">:</div>
                    <div class="time-block">
                        <span id="hours" class="time-number">--</span>
                        <p class="time-label">Hours</p>
                    </div>
                    <div class="time-separator">:</div>
                    <div class="time-block">
                        <span id="minutes" class="time-number">--</span>
                        <p class="time-label">Minutes</p>
                    </div>
                    <div class="time-separator">:</div>
                    <div class="time-block">
                        <span id="seconds" class="time-number">--</span>
                        <p class="time-label">Seconds</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- 5. Polaroids Section -->
        <section id="polaroids" class="polaroids-section" aria-label="Photos of Marco and Jess">
            <div class="container container-wide">
                <div class="polaroids-grid">
                    <div class="polaroid-item polaroid-left">
                        <img src="assets/images/polaroid_1.png" alt="Marco and Jess holding hands with bouquet"
                            width="5978" height="6378" loading="lazy">
                    </div>
                    <div class="polaroid-item polaroid-center">
                        <img src="assets/images/polaroid_2.png" alt="Marco kissing Jess on the forehead"
                            width="4513" height="5169" loading="lazy">
                    </div>
                    <div class="polaroid-item polaroid-right">
                        <img src="assets/images/polaroid_3.png" alt="Marco and Jess walking down steps"
                            width="6693" height="6834" loading="lazy">
                    </div>
                </div>
                <div class="contact-wrapper">
                    <img src="assets/images/contact.png"
                        alt="Stay tuned for more details and RSVPs. For questions you can reach us on WhatsApp: +49-176-4769-2455 (Jess), +39-342-374-9551 (Marco)"
                        class="contact-img" width="2647" height="650" loading="lazy">
                </div>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-logo">
                <img src="assets/logo.png" alt="Marco and Jess Stamp" width="64" height="50">
            </div>
            <p class="footer-eyebrow">Save the Date</p>
            <div class="footer-names">
                <img src="assets/images/names.png" alt="Marco and Jess" class="footer-names-img" width="4844" height="872" loading="lazy">
            </div>
            <p class="footer-tagline">
                September 4, 2027 &bull; San Zenone degli Ezzelini &amp; Bassano del Grappa, Italy
            </p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/script.js"></script>
</body>

</html>
